<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JioTV</title>
</head>
<body>
    <div id="JioTvConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <style>
    .jiotv-card { max-width: 460px; margin: 1.5rem auto; background:#22283a; border-radius:12px; padding:1.5rem; box-shadow:0 4px 12px rgba(0,0,0,.4); }
    .jiotv-card label { display:block; margin:.8rem 0 .2rem; font-size:.85rem; color:#9aa3b8; }
    .jiotv-card input { width:100%; box-sizing:border-box; padding:.55rem; border-radius:8px; border:1px solid #3a4258; background:#181d2c; color:#eee; font-size:1rem; }
    .jiotv-card button { margin-top:1rem; padding:.6rem 1.2rem; border-radius:8px; border:0; }
    .jiotv-hidden { display:none !important; }
    .jiotv-meta { font-size:.82rem; color:#9aa3b8; line-height:1.6; }
    #JioTvMsg { margin-top:.8rem; font-size:.85rem; min-height:1.2em; }
        </style>
        <div data-role="content">
            <div class="content-primary jiotv-card">
                <h2>📺 JioTV</h2>

                <div id="login-ui">
                    <div class="selectContainer">
                        <label class="inputLabel inputLabelUnfocused" for="mobile">Jio mobile number</label>
                        <input id="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit Jio number" is="emby-input" class="emby-input" />
                        <div class="fieldDescription">The number you use inside the JioTV app.</div>
                    </div>
                    <button id="send-otp" is="emby-button" type="button" class="raised button-submit block emby-button"><span>Send OTP</span></button>
                    <div id="otp-ui" class="jiotv-hidden">
                        <div class="selectContainer">
                            <label class="inputLabel inputLabelUnfocused" for="otp">OTP received on SMS</label>
                            <input id="otp" inputmode="numeric" maxlength="6" is="emby-input" class="emby-input" />
                        </div>
                        <button id="verify-otp" is="emby-button" type="button" class="raised button-submit block emby-button"><span>Verify &amp; log in</span></button>
                    </div>
                </div>

                <div id="status-ui" class="jiotv-hidden">
                    <div class="jiotv-meta">
                        <div>👤 <span id="acct"></span></div>
                        <div>🔑 Token valid until <span id="token-exp"></span></div>
                    </div>
                    <button id="logout" is="emby-button" type="button" class="raised button-cancel block emby-button"><span>Log out</span></button>
                </div>

                <div id="JioTvMsg"></div>
            </div>
        </div>

        <script type="text/javascript">
        (function () {
            var g = function (id) { return document.querySelector('#JioTvConfigPage #' + id); };

            function fetchJson(path, type, body) {
                var opts = { url: window.ApiClient.getUrl(path), type: type, dataType: 'json' };
                if (body !== undefined) {
                    opts.data = body;
                    opts.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
                }
                return window.ApiClient.fetch(opts);
            }

            function post(path, data) { return fetchJson(path, 'POST', new URLSearchParams(data).toString()); }

            document.querySelector('#JioTvConfigPage').addEventListener('pageshow', function () {
                var mobileInput = g('mobile'), otpInput = g('otp');
                var sendBtn = g('send-otp'), verifyBtn = g('verify-otp'), logoutBtn = g('logout');
                var msg = g('JioTvMsg'), loginUi = g('login-ui'), statusUi = g('status-ui'), otpUi = g('otp-ui');
                var storedMobile = null;

                function say(t) { msg.textContent = t; }

                function showStatus(st, note) {
                    loginUi.classList.add('jiotv-hidden');
                    statusUi.classList.remove('jiotv-hidden');
                    var shown = st.name ? ('mobile ending ' + st.name.slice(-4)) : 'logged in';
                    g('acct').textContent = shown;
                    g('token-exp').textContent = st.expiry;
                    say(note);
                }

                fetchJson('/JioTv/Auth/Status', 'GET').then(function (st) {
                    if (st && st.loggedIn) { showStatus(st, ''); }
                }).catch(function () { /* stays on login UI */ });

                if (sendBtn.getAttribute('data-wired') === '1') return;
                sendBtn.setAttribute('data-wired', '1');

                sendBtn.addEventListener('click', function () {
                    var m = mobileInput.value.trim();
                    if (!/^\d{10}$/.test(m)) { say('❌ enter a 10-digit Jio mobile number'); return; }
                    sendBtn.disabled = true; say('sending OTP…');
                    post('/JioTv/Auth/SendOtp', { mobileNumber: m }).then(function (r) {
                        sendBtn.disabled = false;
                        if (r && r.status === 'success') {
                            storedMobile = m;
                            otpUi.classList.remove('jiotv-hidden');
                            say('✅ OTP sent; check SMS');
                        } else { say('❌ ' + ((r && r.message) || 'send failed')); }
                    }).catch(function (e) { say('❌ ' + e); });
                });

                verifyBtn.addEventListener('click', function () {
                    verifyBtn.disabled = true; say('verifying…');
                    post('/JioTv/Auth/VerifyOtp', { mobileNumber: storedMobile, otp: otpInput.value.trim() }).then(function (r) {
                        verifyBtn.disabled = false;
                        if (r && r.status === 'success') {
                            fetchJson('/JioTv/Auth/Status', 'GET').then(function (st) {
                                if (st && st.loggedIn) { showStatus(st, '✅ logged in'); }
                            });
                        } else { say('❌ ' + ((r && r.message) || 'invalid OTP')); }
                    }).catch(function (e) { say('❌ ' + e); });
                });

                logoutBtn.addEventListener('click', function () {
                    post('/JioTv/Auth/Logout', {}).then(function () {
                        statusUi.classList.add('jiotv-hidden');
                        loginUi.classList.remove('jiotv-hidden');
                        say('logged out');
                    });
                });
            });
        })();
        </script>
    </div>
</body>
</html>
