---
name: build
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build JioTv.Plugin/JioTv.Plugin.csproj -c Release
      - name: Test
        run: dotnet test JioTv.Tests/JioTv.Tests.csproj --verbosity normal
